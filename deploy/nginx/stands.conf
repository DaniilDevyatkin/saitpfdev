server {
    listen 8300 ssl http2;
    listen [::]:8300 ssl http2;
    server_name devyatkinprod.ru;
    ssl_certificate     /etc/letsencrypt/live/devyatkinprod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devyatkinprod.ru/privkey.pem;
    client_max_body_size 25m;
    # Стенд запрещает встраивание (X-Frame-Options + frame-ancestors 'self').
    # Снимаем запрет и разрешаем рамку только с основного домена витрины.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https://api.yookassa.ru https://mc.yandex.ru https://api-metrika.yandex.net; frame-src 'self' https://yookassa.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://devyatkinprod.ru; script-src-attr 'none'" always;
    location / {
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8400 ssl http2;
    listen [::]:8400 ssl http2;
    server_name devyatkinprod.ru;
    ssl_certificate     /etc/letsencrypt/live/devyatkinprod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devyatkinprod.ru/privkey.pem;
    client_max_body_size 25m;
    # Стенд отдаёт X-Frame-Options: DENY — снимаем, иначе рамка пустая.
    # SAMEORIGIN тут не подходит: порт другой, значит и origin другой.
    proxy_hide_header X-Frame-Options;
    add_header Content-Security-Policy "frame-ancestors https://devyatkinprod.ru" always;
    location / {
        proxy_pass http://127.0.0.1:18400;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
