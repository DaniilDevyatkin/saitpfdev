# Стенды портфолио: каждый на своём порту того же домена.
# Сертификат devyatkinprod.ru валиден для любого порта, поэтому отдельные
# имена не нужны — браузер видит https://devyatkinprod.ru:3100/ и не ругается.

server {
    listen 3100 ssl http2;
    listen [::]:3100 ssl http2;
    server_name devyatkinprod.ru;
    ssl_certificate     /etc/letsencrypt/live/devyatkinprod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devyatkinprod.ru/privkey.pem;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

