{% extends "base.html" %}

{% block body %}
<main>
  <section class="list">
    <div class="wrap">
      <div class="ledger">
        {% for p in projects %}
        <a class="row" href="/project/{{ p.slug }}" style="--accent: {{ p.accent }}">
          <span class="row__num">{{ p.num }}</span>
          <div class="row__main">
            <h2 class="row__name">{{ p.name }} <span class="row__arrow" aria-hidden="true">→</span></h2>
            <p class="row__brief">{{ p.brief }}</p>
          </div>
          <div class="row__shot">
            <img src="/static/shots/{{ p.slug }}.jpg" alt="Снимок проекта {{ p.name }}" loading="lazy">
          </div>
        </a>
        {% endfor %}
      </div>
    </div>
  </section>
</main>
{% endblock %}
